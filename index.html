<!-- VOCAVIA Year 2: all-class leaderboard + game-screen leaderboard access -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#0a0e2a" />
<title>VOCAVIA - Year 2 Edition</title>
<script src="https://cdn.tailwindcss.com"></script>

        colors: {

<style>
:root {
  --color-bg-deep: #0a0e2a;
  --color-bg-mid: #131a44;
  --color-panel: #1b2455;
  --color-panel-glow: #2a3680;
  --color-gold: #f5c542;
  --color-gold-bright: #ffd75e;
  --color-gold-deep: #b8860b;
  --color-primary: #3b82f6;
  --color-accent: #22d3ee;
  --color-success: #22c55e;
  --color-warning: #f59e0b;
  --color-error: #ef4444;
  --color-cream: #f8fafc;

  --font-display: 'Poppins', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', 'Segoe UI', system-ui, sans-serif;
}

@layer base {
  html, body, #root {
    height: 100%;
  }
  body {
    margin: 0;
    font-family: var(--font-body);
    background: radial-gradient(ellipse at top, #1a2150 0%, #0a0e2a 60%, #050717 100%);
    color: var(--color-cream);
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  h1, h2, h3, .font-display {
    font-family: var(--font-display);
  }
}

/* ===== Animations ===== */
@keyframes tile-flip-in {
  0% { transform: rotateY(90deg) scale(0.8); opacity: 0; }
  60% { transform: rotateY(-10deg) scale(1.05); opacity: 1; }
  100% { transform: rotateY(0deg) scale(1); opacity: 1; }
}
.animate-tile-flip {
  animation: tile-flip-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) both;
  transform-style: preserve-3d;
}

@keyframes tile-reveal {
  0% { transform: rotateX(0deg); }
  50% { transform: rotateX(90deg); }
  100% { transform: rotateX(0deg); }
}
.animate-tile-reveal {
  animation: tile-reveal 0.45s ease-in-out both;
  transform-style: preserve-3d;
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-8px); }
  40% { transform: translateX(8px); }
  60% { transform: translateX(-6px); }
  80% { transform: translateX(6px); }
}
.animate-shake {
  animation: shake 0.4s ease-in-out;
}

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 20px rgba(34, 197, 94, 0.6), 0 0 40px rgba(34, 197, 94, 0.3); }
  50% { box-shadow: 0 0 30px rgba(34, 197, 94, 0.9), 0 0 60px rgba(34, 197, 94, 0.5); }
}
.animate-glow-correct {
  animation: glow-pulse 1s ease-in-out infinite;
}

@keyframes urgent-pulse {
  0%, 100% { transform: scale(1); color: var(--color-error); }
  50% { transform: scale(1.12); color: #ff6b6b; }
}
.animate-urgent {
  animation: urgent-pulse 0.5s ease-in-out infinite;
}

@keyframes confetti-fall {
  0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
  100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
}
.confetti-piece {
  position: absolute;
  width: 10px;
  height: 14px;
  animation: confetti-fall linear forwards;
}

@keyframes picker-flicker {
  0% { opacity: 0.3; transform: translateY(4px); }
  50% { opacity: 1; transform: translateY(0); }
  100% { opacity: 0.3; transform: translateY(-4px); }
}
.animate-picker-flicker {
  animation: picker-flicker 0.12s ease-in-out infinite;
}

@keyframes fade-in-up {
  0% { opacity: 0; transform: translateY(12px); }
  100% { opacity: 1; transform: translateY(0); }
}
.animate-fade-in-up {
  animation: fade-in-up 0.4s ease-out both;
}

@keyframes scale-in {
  0% { opacity: 0; transform: scale(0.85); }
  100% { opacity: 1; transform: scale(1); }
}
.animate-scale-in {
  animation: scale-in 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

@keyframes countdown-pop {
  0% { opacity: 0; transform: scale(2.2); }
  30% { opacity: 1; transform: scale(1); }
  80% { opacity: 1; transform: scale(1); }
  100% { opacity: 0; transform: scale(0.8); }
}
.animate-countdown {
  animation: countdown-pop 1s ease-out both;
}

@keyframes float-up {
  0% { opacity: 0; transform: translateY(0) scale(0.8); }
  30% { opacity: 1; transform: translateY(-20px) scale(1.1); }
  100% { opacity: 0; transform: translateY(-60px) scale(1); }
}
.animate-float-up {
  animation: float-up 1.2s ease-out both;
}

/* ===== Tile visual states ===== */
/* GIVEN — automatically supplied first letter. Locked, gold. */
.tile-given {
  background: linear-gradient(160deg, #ffd75e 0%, #f5c542 60%, #b8860b 100%);
  color: #0a0e2a;
  border: 2px solid #c9a227;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.5),
    inset 0 -3px 0 rgba(0,0,0,0.2),
    0 4px 10px rgba(245,197,66,0.4);
}

/* HINT — progressive reveal. Locked, cyan with dashed accent. */
.tile-hint {
  background: linear-gradient(160deg, #67e8f9 0%, #22d3ee 60%, #0891b2 100%);
  color: #0a0e2a;
  border: 2px dashed #0e7490;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.4),
    0 4px 10px rgba(34,211,238,0.35);
}

/* PLAYER — entered by the player. Editable, cream. */
.tile-player {
  background: linear-gradient(160deg, #fdf6e3 0%, #f5e9c0 60%, #e8d59a 100%);
  color: #1a1a2e;
  border: 2px solid #c9a227;
  box-shadow:
    inset 0 2px 0 rgba(255,255,255,0.7),
    inset 0 -3px 0 rgba(0,0,0,0.15),
    0 4px 8px rgba(0,0,0,0.35);
}

/* EMPTY — waiting for input. Dark, dashed border. */
.tile-empty {
  background: rgba(27, 36, 85, 0.6);
  color: transparent;
  border: 2px dashed rgba(245, 197, 66, 0.35);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
}

/* Current active empty tile — subtle pulsing ring. */
.tile-current {
  border-color: rgba(245, 197, 66, 0.8);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.05),
    0 0 0 2px rgba(245, 197, 66, 0.3),
    0 0 12px rgba(245, 197, 66, 0.2);
}

@keyframes tile-pop {
  0% { transform: scale(0.7); }
  60% { transform: scale(1.15); }
  100% { transform: scale(1); }
}
.animate-tile-pop {
  animation: tile-pop 0.25s cubic-bezier(0.34, 1.56, 0.64, 1) both;
}

/* ===== On-screen keyboard ===== */
.kbd-key {
  background: linear-gradient(160deg, #2a3680 0%, #1b2455 100%);
  border: 1px solid rgba(245, 197, 66, 0.25);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 2px 4px rgba(0,0,0,0.3);
  transition: transform 0.08s, background 0.12s, box-shadow 0.12s;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
.kbd-key:active, .kbd-key.pressed {
  transform: scale(0.92);
  background: linear-gradient(160deg, #3b82f6 0%, #2a3680 100%);
  box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
}
.kbd-key:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* ENTER key — visually distinct from letter keys */
.kbd-enter {
  background: linear-gradient(160deg, rgba(34,197,94,0.25) 0%, rgba(8,145,178,0.15) 100%);
  border: 1px solid rgba(34,197,94,0.4);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 2px 6px rgba(34,197,94,0.15);
}
.kbd-enter:not(:disabled):active {
  background: linear-gradient(160deg, rgba(34,197,94,0.5) 0%, rgba(8,145,178,0.3) 100%);
  transform: scale(0.92);
}

.panel-glow {
  box-shadow: 0 0 24px rgba(58, 130, 246, 0.25), inset 0 1px 0 rgba(255,255,255,0.08);
}

.gold-text {
  background: linear-gradient(180deg, #ffd75e 0%, #f5c542 50%, #b8860b 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* Scrollbar */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
::-webkit-scrollbar-thumb { background: rgba(245,197,66,0.4); border-radius: 4px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* Standalone-file helpers */
html,body,#root{width:100%;height:100%;min-height:100%;}
body{overscroll-behavior:none;}
</style>
